org.gradle.daemon = true
org.gradle.parallel = false
org.gradle.caching = false

kotlin.incremental = true
kotlin.coroutines = enable
java.incremental = true

# parameters
baseVersion = 2.0.4
snapshotVersion = -SNAPSHOT

##
## common library
##

kotlin_version = 1.3.10
kotlinx_coroutines_version = 1.0.1
dokka_version = 0.9.17

requery_version = 1.5.1

# spring_boot1_version = 1.5.14.RELEASE
# spring_boot2_version = 2.0.3.RELEASE
# SECURITY (Finding 2): Spring Boot 2.0.x is EOL and pulls Spring Framework 5.0.x, which is
# affected by CVE-2022-22965 (Spring4Shell RCE) and CVE-2016-1000027 (HttpInvoker deserialization).
# Fixes require Spring Framework 5.2.20+/5.3.18+ (Spring Boot 2.6.6+), a major migration that
# breaks this branch's "Spring Boot 2.0.x" compatibility contract. Tracked as a separate epic
# (see SECURITY.md > Remediation roadmap). Not changed in this dependency-hygiene PR.
spring_boot_version = 2.0.8.RELEASE

junit_platform_version = 1.3.2
junit_jupiter_version = 5.3.2

testcontainers_version = 1.10.6
